name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host checks (fmt, tests, clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain is pinned in rust-toolchain.toml; `rustup show` installs it
      # (together with the rustfmt/clippy components it lists) if missing.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The driver needs the WDK and cannot be built on a stock runner; this
      # job covers everything host-testable: the pure logic crate and the
      # build/test tooling. Build the driver locally with `cargo xtask`.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Unit tests (elam-core, xtask)
        run: cargo test --locked -p elam-core -p xtask

      - name: Clippy (core + tooling)
        run: cargo clippy --locked -p elam-core -p xtask -p ppl-test --all-targets -- -D warnings

      # Guards the only_cert regression: the ELAM cert resource must be emitted
      # as 'MicrosoftElamCertificateInfo MSElamCertInfoID'.
      - name: Verify ELAM certificate resource format
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check_elam_resource.ps1

      - name: Install Pester (>= 5)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Pester tests (PowerShell scripts)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1

  # Building the driver (and ppl_test) needs the WDK and LLVM/libclang, which a
  # stock GitHub runner does not have. This jobs targets a self-hosted Windows
  # runner with the WDK installed (and detected, e.g. via WDKContentRoot) and
  # LLVM available. Adjust the `runs-on` labels / LIBCLANG_PATH to match it.
  driver:
    name: Driver build (self-hosted, WDK + LLVM)
    # Never run untrusted pull_request code on a self-hosted runner, and stay
    # disabled until a matching runner exists (otherwise the job queues forever
    # and stalls the whole run). Enable by setting the repository variable
    # ENABLE_DRIVER_CI=true once such a runner is registered.
    if: github.event_name == 'push' && vars.ENABLE_DRIVER_CI == 'true'
    runs-on: [self-hosted, windows, x64]
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The driver embeds the ELAM cert hash from a generated .rc file, so the
      # certificate must be created before building.
      - name: Generate certificate and resource
        run: cargo run --locked --package xtask -- resources

      - name: Build driver
        run: cargo build --locked -p elam-rs

      # Catches a dropped/renamed embedded ELAM resource, not just .rc text.
      - name: Verify embedded ELAM certificate resource
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check_driver_resource.ps1

      - name: Build ppl-test
        run: cargo build --locked -p ppl-test
