[workspace]
members = ["elam-core", "xtask", "ppl-test"]
default-members = ["."]
resolver = "2"

[package]
name = "elam-rs"
version = "0.1.1"
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["windows", "driver", "example", "wdf", "elam"]
categories = ["hardware-support"]
build = "build.rs"

[package.metadata.wdk.driver-model]
driver-type = "WDM"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]
# Tests from root driver crates must be excluded since there's no way to prevent linker args from being passed to their unit tests: https://github.com/rust-lang/cargo/issues/12663
# Pure logic lives in the `elam-core` crate, which is tested on the host.
test = false

[build-dependencies]
# Pinned to a specific windows-drivers-rs commit for reproducible builds. The
# five wdk crates no longer share a version number (wdk 0.5.0, wdk-sys 0.5.2,
# wdk-build 0.6.0, ...), so only the revision is specified here.
wdk-build = { git = "https://github.com/microsoft/windows-drivers-rs.git", package = "wdk-build", rev = "d5fd6b30ff8c236a9ea0119ad04c343185c18968" }
embed-resource = "2.4.3"
elam-core = { path = "elam-core" }

[dependencies]
wdk = { git = "https://github.com/microsoft/windows-drivers-rs.git", package = "wdk", rev = "d5fd6b30ff8c236a9ea0119ad04c343185c18968" }
wdk-alloc = { git = "https://github.com/microsoft/windows-drivers-rs.git", package = "wdk-alloc", rev = "d5fd6b30ff8c236a9ea0119ad04c343185c18968" }
wdk-panic = { git = "https://github.com/microsoft/windows-drivers-rs.git", package = "wdk-panic", rev = "d5fd6b30ff8c236a9ea0119ad04c343185c18968" }
wdk-sys = { git = "https://github.com/microsoft/windows-drivers-rs.git", package = "wdk-sys", rev = "d5fd6b30ff8c236a9ea0119ad04c343185c18968" }
elam-core = { path = "elam-core" }


[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true
